# Add inside the existing HTTPS server for voter-app.ai-developer.cloud.
location = /download/politic-ease.json {
    alias /var/www/politic-ease-updates/politic-ease.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
location /download/ {
    alias /var/www/politic-ease-updates/;
    autoindex off;
    types { application/vnd.android.package-archive apk; application/json json; }
    add_header X-Content-Type-Options nosniff always;
}
